name: Reusable - Deploy Native Nix App

# Call from any Nix-packaged app repo (e.g. albi005/alb1.hu):
#
#   jobs:
#     deploy:
#       uses: albi005/.config/.github/workflows/reusable-deploy-nix-app.yml@main
#       with:
#         app: alb1
#       secrets:
#         CONFIG_REPO_TOKEN: ${{ secrets.CONFIG_REPO_TOKEN }}

on:
  workflow_call:
    inputs:
      app:
        description: "App directory name under nixos/apps/<app> (also default flake package attr)"
        required: true
        type: string
      nix_attr:
        description: "Flake package attribute to build/verify (defaults to inputs.app)"
        required: false
        type: string
        default: ""
      config_repo:
        description: "Target NixOS config repository"
        required: false
        type: string
        default: "albi005/.config"
      version_prefix:
        description: "Version prefix before run_number"
        required: false
        type: string
        default: "0.0"
    secrets:
      CONFIG_REPO_TOKEN:
        description: "Fine-grained PAT with contents:write and pull_requests:write on config_repo"
        required: true

jobs:
  open-pr:
    name: Pin ${{ inputs.app }} and open PR
    runs-on: ubuntu-latest
    steps:
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Compute GitHub archive SRI hash for ${{ github.sha }}
        id: hash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rev="${GITHUB_SHA}"
          short_sha="${rev:0:7}"
          version="${{ inputs.version_prefix }}.${GITHUB_RUN_NUMBER}-${short_sha}"
          url="https://github.com/${GITHUB_REPOSITORY}/archive/${rev}.tar.gz"

          # Retry briefly in case GitHub's archive endpoint lags a second behind push
          for attempt in 1 2 3; do
            if raw_hash=$(nix-prefetch-url --unpack --type sha256 "$url" 2>/dev/null); then
              break
            fi
            sleep 3
          done
          sri_hash=$(nix hash convert --hash-algo sha256 --to sri "$raw_hash")

          echo "rev=${rev}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "hash=${sri_hash}" >> "$GITHUB_OUTPUT"

      - name: Checkout ${{ inputs.config_repo }}
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.config_repo }}
          token: ${{ secrets.CONFIG_REPO_TOKEN }}
          path: config-repo

      - name: Update pin.json (and deps.json if applicable)
        id: pin
        working-directory: config-repo
        run: |
          out=$(./scripts/ci/update-app-pin.sh nix \
            "${{ inputs.app }}" \
            "${{ steps.hash.outputs.rev }}" \
            "${{ steps.hash.outputs.version }}" \
            "${{ steps.hash.outputs.hash }}")
          old_rev=$(echo "$out" | awk -F= '/^OLD_REV=/ { print $2 }')
          echo "old_rev=${old_rev}" >> "$GITHUB_OUTPUT"

      - name: Verify app package builds cleanly
        working-directory: config-repo
        run: |
          attr="${{ inputs.nix_attr || inputs.app }}"
          nix build --print-build-logs "./nixos#${attr}"

      - name: Open or update deployment PR
        working-directory: config-repo
        env:
          GH_TOKEN: ${{ secrets.CONFIG_REPO_TOKEN }}
        run: |
          branch="deploy-app/${{ inputs.app }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "No changes to nixos/apps/${{ inputs.app }}; skipping PR."
            exit 0
          fi

          git checkout -B "$branch"
          git add "nixos/apps/${{ inputs.app }}"
          git commit -m "deploy(${{ inputs.app }}): bump to ${{ steps.hash.outputs.version }}"
          git push --force-with-lease origin "$branch"

          old_rev="${{ steps.pin.outputs.old_rev }}"
          new_rev="${{ steps.hash.outputs.rev }}"
          if [ -n "$old_rev" ] && [ "$old_rev" != "$new_rev" ]; then
            compare_line="Changes: https://github.com/${GITHUB_REPOSITORY}/compare/${old_rev:0:7}...${new_rev:0:7}"
          else
            compare_line="Commit: https://github.com/${GITHUB_REPOSITORY}/commit/${new_rev}"
          fi

          title="deploy(${{ inputs.app }}): ${{ steps.hash.outputs.version }}"
          body=$(cat <<EOF
          Automated Nix app update triggered by [\`${GITHUB_REPOSITORY}@${new_rev:0:7}\`](https://github.com/${GITHUB_REPOSITORY}/commit/${new_rev}).

          - **App**: \`${{ inputs.app }}\` (native Nix build)
          - **Version**: \`${{ steps.hash.outputs.version }}\`
          - ${compare_line}

          Merge this PR once CI checks pass to deploy automatically via \`comin\`.
          EOF
          )

          existing_pr=$(gh pr list --repo "${{ inputs.config_repo }}" --head "$branch" --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing_pr" ]; then
            gh pr edit "$existing_pr" --repo "${{ inputs.config_repo }}" --title "$title" --body "$body"
          else
            gh pr create --repo "${{ inputs.config_repo }}" --base main --head "$branch" --title "$title" --body "$body"
          fi
