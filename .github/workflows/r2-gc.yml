name: Cloudflare R2 Binary Cache GC

on:
  schedule:
    # Weekly on Sunday at 04:00 UTC
    - cron: "0 4 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report objects that would be deleted without removing them"
        required: false
        type: boolean
        default: false
      max_age_days:
        description: "Delete unreferenced objects older than this many days"
        required: false
        type: string
        default: "30"

permissions:
  contents: read

jobs:
  gc:
    name: Prune unreferenced R2 store paths
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v16

      - name: Run R2 garbage collection
        env:
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          MAX_AGE_DAYS: ${{ inputs.max_age_days || '30' }}
        run: |
          if [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${R2_BUCKET:-}" ] || [ -z "${R2_ENDPOINT:-}" ]; then
            echo "R2 cache not configured yet — skipping GC."
            exit 0
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ./scripts/ci/r2-gc.sh --dry-run
          else
            ./scripts/ci/r2-gc.sh
          fi
