name: NixOS GitOps Deploy

on:
  push:
    branches: [main]
    paths:
      - "nixos/**"
      - "scripts/ci/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      hosts:
        description: "JSON array of hosts to deploy (default: all 5)"
        required: false
        default: '["iron","slime","redstone","netherite","water"]'

permissions:
  contents: write

concurrency:
  group: nixos-gitops-deploy
  cancel-in-progress: false

jobs:
  plan:
    name: Select hosts
    runs-on: ubuntu-latest
    outputs:
      hosts: ${{ steps.hosts.outputs.hosts }}
    steps:
      - id: hosts
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.hosts }}" ]; then
            echo 'hosts=${{ inputs.hosts }}' >> "$GITHUB_OUTPUT"
          else
            echo 'hosts=["iron","slime","redstone","netherite","water"]' >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Build, cache & release (${{ matrix.host }})
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.plan.outputs.hosts) }}
    steps:
      - uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost /opt/hostedtoolcache/CodeQL

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16
        with:
          extra-conf: |
            extra-substituters = https://nix-community.cachix.org https://nvf.cachix.org ${{ vars.R2_CACHE_URL }}
            extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= nvf.cachix.org-1:GMQWiUhZ6ux9D5CvFFMwnc2nFrUHTeGaXRlVBXo+naI= ${{ vars.R2_PUBLIC_KEY }}
            fallback = true
            connect-timeout = 5

      - name: Build host toplevel
        run: |
          nix build --print-build-logs \
            "./nixos#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel" \
            -o /tmp/result

      - name: Upload custom store paths to Cloudflare R2
        env:
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          NIX_SIGNING_KEY: ${{ secrets.NIX_SIGNING_KEY }}
        run: |
          if [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${R2_BUCKET:-}" ] || [ -z "${R2_ENDPOINT:-}" ] || [ -z "${NIX_SIGNING_KEY:-}" ]; then
            echo "::warning::R2 binary cache not configured yet; skipping cache upload (weak hosts like iron/water would build locally until configured!)."
            exit 0
          fi
          key_file=$(mktemp)
          trap 'rm -f "$key_file"' EXIT
          chmod 600 "$key_file"
          printf '%s' "$NIX_SIGNING_KEY" > "$key_file"
          NIX_SIGNING_KEY_FILE="$key_file" ./scripts/ci/push-to-r2.sh /tmp/result

      # Atomically advance deploy/<host> ONLY after build + R2 push succeed.
      # comin on each machine polls deploy/<host> and switches cleanly using prebuilt closures.
      - name: Advance deploy/${{ matrix.host }} branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOST: ${{ matrix.host }}
        run: |
          ref="heads/deploy/${HOST}"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/${ref}" >/dev/null 2>&1; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/${ref}" \
              -f sha="${GITHUB_SHA}" \
              -F force=true
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/${ref}" \
              -f sha="${GITHUB_SHA}"
          fi
          echo "Advanced deploy/${HOST} -> ${GITHUB_SHA}"
