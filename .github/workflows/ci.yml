name: NixOS CI

on:
  pull_request:
    branches: [main]
    paths:
      - "nixos/**"
      - "scripts/ci/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect affected hosts
    runs-on: ubuntu-latest
    outputs:
      hosts: ${{ steps.detect.outputs.hosts }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: detect
        run: |
          ALL_HOSTS='["iron","slime","redstone","netherite","water"]'

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "hosts=${ALL_HOSTS}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base="${{ github.event.pull_request.base.sha }}"
          changed=$(git diff --name-only "$base" HEAD)
          echo "Changed files:"
          echo "$changed"

          # If any shared Nix file changed, validate all 5 hosts.
          if echo "$changed" | grep -qE '^(nixos/(flake\.(nix|lock)|modules/|lib/|pins/|apps/|pkgs/)|scripts/ci/|\.github/workflows/(ci|deploy)\.yml)'; then
            echo "hosts=${ALL_HOSTS}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Otherwise, only build the specific hosts whose directory changed.
          hosts=()
          for h in iron slime redstone netherite water; do
            if echo "$changed" | grep -q "^nixos/hosts/${h}/"; then
              hosts+=("$h")
            fi
          done

          if [ "${#hosts[@]}" -eq 0 ]; then
            echo "hosts=[]" >> "$GITHUB_OUTPUT"
          else
            json=$(printf '%s\n' "${hosts[@]}" | jq -R . | jq -s -c .)
            echo "hosts=${json}" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build (${{ matrix.host }})
    needs: detect
    if: ${{ needs.detect.outputs.hosts != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.detect.outputs.hosts) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Free disk space on ubuntu-latest so large NixOS closures never hit ENOSPC
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16
        with:
          extra-conf: |
            extra-substituters = https://nix-community.cachix.org https://nvf.cachix.org ${{ vars.R2_CACHE_URL }}
            extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= nvf.cachix.org-1:GMQWiUhZ6ux9D5CvFFMwnc2nFrUHTeGaXRlVBXo+naI= ${{ vars.R2_PUBLIC_KEY }}
            fallback = true
            connect-timeout = 5

      - name: Build host toplevel
        run: |
          nix build --print-build-logs \
            "./nixos#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel" \
            -o /tmp/candidate

      - name: Push custom store paths to Cloudflare R2
        env:
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          NIX_SIGNING_KEY: ${{ secrets.NIX_SIGNING_KEY }}
        run: |
          if [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${R2_BUCKET:-}" ] || [ -z "${R2_ENDPOINT:-}" ] || [ -z "${NIX_SIGNING_KEY:-}" ]; then
            echo "R2 binary cache secrets/vars not configured yet — skipping upload (see nixos/GITOPS.md)."
            exit 0
          fi
          key_file=$(mktemp)
          trap 'rm -f "$key_file"' EXIT
          chmod 600 "$key_file"
          printf '%s' "$NIX_SIGNING_KEY" > "$key_file"
          NIX_SIGNING_KEY_FILE="$key_file" ./scripts/ci/push-to-r2.sh /tmp/candidate

      - name: Compute closure diff (nvd)
        id: diff
        run: |
          mkdir -p /tmp/diffs
          out="/tmp/diffs/${{ matrix.host }}.md"

          if git ls-remote --exit-code --heads origin "deploy/${{ matrix.host }}" >/dev/null 2>&1; then
            git fetch origin "deploy/${{ matrix.host }}:refs/remotes/origin/deploy/${{ matrix.host }}" --depth=1
            git worktree add --detach /tmp/baseline-repo "origin/deploy/${{ matrix.host }}"
            if nix build \
              "/tmp/baseline-repo/nixos#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel" \
              -o /tmp/baseline; then
              nvd_out=$(nix run "./nixos#nixosConfigurations.${{ matrix.host }}.pkgs.nvd" -- diff /tmp/baseline /tmp/candidate || true)
              {
                echo "### \`${{ matrix.host }}\` (vs \`deploy/${{ matrix.host }}\`)"
                echo '```'
                echo "$nvd_out"
                echo '```'
              } > "$out"
            else
              echo "### \`${{ matrix.host }}\`: built cleanly (baseline diff unavailable)" > "$out"
            fi
          else
            echo "### \`${{ matrix.host }}\`: built cleanly (no \`deploy/${{ matrix.host }}\` baseline yet)" > "$out"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: diff-${{ matrix.host }}
          path: /tmp/diffs/${{ matrix.host }}.md

  comment:
    name: Post closure diff on PR
    needs: [detect, build]
    if: ${{ always() && github.event_name == 'pull_request' && needs.detect.outputs.hosts != '[]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: diff-*
          path: /tmp/all-diffs
          merge-multiple: true
        continue-on-error: true

      - name: Create or update PR comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          marker="<!-- nixos-gitops-ci-diff -->"
          body_file=$(mktemp)
          {
            echo "$marker"
            if [ "$BUILD_RESULT" = "success" ]; then
              echo "## NixOS GitOps Build & Closure Diff :white_check_mark:"
            else
              echo "## NixOS GitOps Build & Closure Diff :x:"
            fi
            echo ""
            echo "Merging this PR will advance \`deploy/<host>\` after confirming every closure is cached in Cloudflare R2."
            echo ""
            if [ -d /tmp/all-diffs ] && [ -n "$(ls -A /tmp/all-diffs 2>/dev/null)" ]; then
              for f in /tmp/all-diffs/*.md; do
                echo "<details><summary>$(head -n 1 "$f" | sed 's/^### //')</summary>"
                echo ""
                tail -n +2 "$f"
                echo "</details>"
                echo ""
              done
            else
              echo "_No diff artifacts produced (build failed before diff step)._"
            fi
          } > "$body_file"

          existing_id=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --jq ".[] | select(.body | contains(\"${marker}\")) | .id" | head -n 1 || true)

          if [ -n "$existing_id" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing_id}" -F body=@"$body_file"
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -F body=@"$body_file"
          fi
